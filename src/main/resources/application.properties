spring.application.name=precisionAppBE
spring.config.import=optional:file:./application-local.properties
# URL de conexi�n (Ejemplo para MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/precision_v2?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
# Credenciales
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Driver del conector (Opcional en versiones modernas, Spring lo detecta)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Timezone — Hibernate siempre envía y lee DATETIME en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=${SERVER_PORT:10080}
# CORS — orígenes permitidos (separados por coma si hay más de uno)
# En producción sobreescribir con la URL real del frontend via variable de entorno CORS_ALLOWED_ORIGINS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:10081,http://localhost}
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# spring.flyway.target=2
logging.level.org.flywaydb=INFO
spring.jpa.hibernate.ddl-auto=validate
server.error.include-message=never
app.super-admin.password=${SUPER_ADMIN_PASSWORD}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Spring Boot Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=precisionAppBE

# HikariCP Connection Pool Optimization
spring.datasource.hikari.pool-name=PrecisionHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=15000
