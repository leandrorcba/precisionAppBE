spring.application.name=precisionAppBE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/precision_schema_v2?serverTimezone=UTC&useLegacyDatetimeCode=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# Timezone — Hibernate siempre envía y lee DATETIME en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# CORS — orígenes permitidos (separados por coma si hay más de uno)
# En producción sobreescribir con la URL real del frontend via variable de entorno CORS_ALLOWED_ORIGINS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

