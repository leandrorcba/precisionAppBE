services:
  db:
    image: mysql:8.0.43
    container_name: precision_db
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "precision_schema_v2"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: precision_backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/precision_schema_v2?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      CORS_ALLOWED_ORIGINS: "https://precision.lbrebolini.net"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../claudeCode/presision-app
      dockerfile: Dockerfile
    container_name: precision_frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data: